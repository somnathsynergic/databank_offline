// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 33

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.room:room-runtime:2.5.2'
            force 'androidx.room:room-ktx:2.5.2'
            force 'androidx.room:room-common:2.5.2'
            force 'androidx.sqlite:sqlite:2.3.1'
            force 'androidx.sqlite:sqlite-framework:2.3.1'
            force 'androidx.sqlite:sqlite-android:2.3.1'
            force 'androidx.sqlite:sqlite-bundled:2.3.1'
            force 'androidx.sqlite:sqlite-bundled-android:2.3.1'
            force 'androidx.annotation:annotation-experimental:1.3.0'
        }
    }
}

subprojects {
    project.configurations.all {
        resolutionStrategy {
            force 'androidx.room:room-runtime:2.5.2'
            force 'androidx.room:room-ktx:2.5.2'
            force 'androidx.room:room-common:2.5.2'
            force 'androidx.sqlite:sqlite:2.3.1'
            force 'androidx.sqlite:sqlite-framework:2.3.1'
            force 'androidx.sqlite:sqlite-android:2.3.1'
            force 'androidx.sqlite:sqlite-bundled:2.3.1'
            force 'androidx.sqlite:sqlite-bundled-android:2.3.1'
            force 'androidx.annotation:annotation-experimental:1.3.0'
        }
    }
}
